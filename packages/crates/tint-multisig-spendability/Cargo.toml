[package]
name = "tint-multisig-spendability"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
tint = { workspace = true }
ark-bn254 = { workspace = true, features = ["scalar_field"] }
ark-ff = { workspace = true }
thiserror = { workspace = true }
alloy-primitives = { workspace = true }
async-trait = { workspace = true }
k256 = { workspace = true }
signature = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
bindgen = { workspace = true }

[dev-dependencies]
ark-ec = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true, features = ["std"] }
ark-secp256k1 = { workspace = true }
ark-std = { workspace = true }
taceo-poseidon2 = { workspace = true, features = ["t2", "t3", "t8"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
alloy-node-bindings = { workspace = true }
alloy-provider = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-macro = { workspace = true, features = ["json"] }
alloy-sol-types = { workspace = true }
alloy-contract = { workspace = true }
anyhow = { workspace = true }

[[bench]]
name = "prove"
harness = false
