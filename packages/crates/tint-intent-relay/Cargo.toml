[package]
name = "tint-intent-relay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tint-intent-relay"
path = "src/bin/relay.rs"

[[bin]]
name = "tint-intent-maker"
path = "src/bin/maker.rs"

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-provider = { workspace = true }
alloy-signer-local = { workspace = true }
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["env"] }
rand_core = { workspace = true, features = ["getrandom"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_with = { workspace = true }
thiserror = { workspace = true }
tint = { workspace = true }
tint-groth16 = { workspace = true }
tint-intent-policy = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
alloy-contract = { workspace = true }
alloy-node-bindings = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-sol-macro = { workspace = true, features = ["json"] }
alloy-sol-types = { workspace = true }
ark-std = { workspace = true }

[lints]
workspace = true
