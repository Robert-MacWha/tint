[workspace]
members = [
    "cli",
    "tint",
    "tint-multisig-spendability",
    "tint-password-spendability",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "warn"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"

[workspace.dependencies]
alloy = "1.6"
alloy-contract = "1.6.0"
alloy-node-bindings = "1.6.0"
alloy-primitives = "1.6.0"
alloy-provider = "1.6.0"
alloy-rpc-types-eth = "1.6.0"
alloy-signer-local = "1.6.0"
alloy-sol-macro = "1.6.0"
alloy-sol-types = "1.6.0"
anyhow = "1.0.103"
ark-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-ed-on-bn254 = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-poly = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-relations = "0.6.0"
ark-secp256k1 = "0.6.0"
ark-secp256r1 = "0.6.0"
ark-serialize = "0.6.0"
ark-snark = "0.6.0"
ark-std = "0.6.0"
async-trait = "0.1.89"
bindgen = "0.72"
brotli = "8.0.4"
chacha20poly1305 = "0.10.1"
ark-profiler = "0.1.0"
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
hkdf = "0.12.4"
insta = "1.48.0"
k256 = "0.14"
postcard = "1.1.3"
rand_core = "0.6.4"
rayon = "1.8"
ruint = "1.19.0"
serde = "1.0.228"
serde_json = "1.0"
serde_with = "3.21.0"
sha2 = "0.10.9"
signature = "3"
taceo-poseidon2 = { git = "https://github.com/Robert-MacWha/eddsa-babyjubjub" }
thiserror = "2.0.18"
tint = { path = "./tint" }
tint-multisig-spendability = { path = "./tint-multisig-spendability" }
tint-password-spendability = { path = "./tint-password-spendability" }
tokio = { version = "1" }
tracing = "0.1.44"
tracing-subscriber = "0.3"
x25519-dalek = "2.0.1"
