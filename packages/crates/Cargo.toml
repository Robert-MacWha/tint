[workspace]
members = [
    "cli",
    "tint",
    "tint-groth16",
    "tint-multisig-policy",
    "tint-paymaster",
    "tint-password-policy",
    "tint-poseidon2",
    "tint-web",
    "tint-web-protocol",
    "tint-web-worker",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "warn"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"

[workspace.dependencies]
alloy = "2.4.1"
alloy-contract = "2.4.1"
alloy-node-bindings = "2.4.1"
alloy-primitives = "1.7.2"
alloy-provider = "2.4.1"
alloy-rpc-types-eth = "2.4.1"
alloy-signer-local = "2.4.1"
alloy-sol-macro = "1.7.2"
alloy-sol-types = "1.7.2"
anyhow = "1.0.103"
ark-bn254 = "0.6.0"
ark-crypto-primitives = "0.6.0"
ark-ec = "0.6.0"
ark-ed-on-bn254 = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = { version = "0.6.0", default-features = false, features = [
    "std",
] }
ark-hybrid-compression = { git = "https://github.com/Robert-MacWha/ark-hybrid-compression" }
ark-poly = "0.6.0"
ark-profiler = "0.1.0"
ark-r1cs-std = "0.6.0"
ark-relations = "0.6.0"
ark-secp256k1 = "0.6.0"
ark-secp256r1 = "0.6.0"
ark-serialize = "0.6.0"
ark-snark = "0.6.0"
ark-std = "0.6.0"
async-trait = "0.1.89"
bindgen = "0.72"
brotli = "8.0.4"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
criterion = "0.8.2"
dioxus = { version = "=0.7.9", features = ["web"] }
futures = "0.3.32"
hkdf = "0.12.4"
insta = "1.48.0"
js-sys = "0.3.85"
k256 = "0.14"
kohaku-fork-kit = { git = "https://github.com/ethereum/kohaku-rs", rev = "e3639d1c8c767682e229de4ae37b48dd445b5633" }
kohaku-userop-kit = { git = "https://github.com/ethereum/kohaku-rs", rev = "e3639d1c8c767682e229de4ae37b48dd445b5633" }
postcard = "1.1.3"
rand_core = "0.6.4"
rayon = "1.8"
ruint = "1.19.0"
serde = "1.0.228"
serde_json = "1.0"
serde_with = "3.21.0"
sha2 = "0.10.9"
signature = "3"
skew-mmr = { git = "https://github.com/Robert-MacWha/efficient-inclusion-proofs" }
taceo-poseidon2 = { git = "https://github.com/Robert-MacWha/eddsa-babyjubjub" }
thiserror = "2.0.18"
tint = { path = "./tint", default-features = false }
tint-groth16 = { path = "./tint-groth16" }
tint-multisig-policy = { path = "./tint-multisig-policy" }
tint-password-policy = { path = "./tint-password-policy" }
tint-poseidon2 = { path = "./tint-poseidon2" }
tint-web-protocol = { path = "./tint-web-protocol" }
tokio = { version = "1" }
tracing = "0.1.44"
tracing-subscriber = "0.3"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4.58"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"] }
web-sys = "0.3.85"
x25519-dalek = "2.0.1"

[patch.crates-io]
# ark-ec 0.6.0's parallel MSM spawns a thread pool per call, which panics on
# wasm; fixed on master (arkworks-rs/algebra#1112) but not yet released.
ark-ec = { git = "https://github.com/arkworks-rs/algebra", rev = "d7f73154500ee45e52d87d43ca3584ad3f2072d4" }
ark-ff = { git = "https://github.com/arkworks-rs/algebra", rev = "d7f73154500ee45e52d87d43ca3584ad3f2072d4" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra", rev = "d7f73154500ee45e52d87d43ca3584ad3f2072d4" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra", rev = "d7f73154500ee45e52d87d43ca3584ad3f2072d4" }
# ark-groth16 parallel performance improvement.
# ark-groth16 = { git = "https://github.com/Robert-MacWha/groth16", branch = "perf/increased-parallelization" }
