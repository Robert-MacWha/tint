[workspace]
members = [
    "cli",
    "tint",
    "circuit-profiler",
    "tint-password-spendability",
    "tint-multisig-spendability",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
tint = { path = "./tint" }
tint-password-spendability = { path = "./tint-password-spendability" }
tint-multisig-spendability = { path = "./tint-multisig-spendability" }
alloy = "1.6"
alloy-primitives = "1.6.0"
alloy-provider = "1.6.0"
alloy-rpc-types-eth = "1.6.0"
alloy-sol-macro = "1.6.0"
alloy-sol-types = "1.6.0"
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-snark = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-relations = "0.6.0"
ark-ed-on-bn254 = "0.6.0"
ark-ec = "0.6.0"
ark-secp256r1 = "0.6.0"
async-trait = "0.1.89"
clap = { version = "4.5", features = ["derive"] }
ruint = "1.19.0"
thiserror = "2.0.18"
tracing = "0.1.44"
x25519-dalek = "2.0.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10.9"
rand_core = "0.6.4"
tokio = { version = "1" }
ark-std = "0.6.0"
postcard = "1.1.3"
serde = "1.0.228"
taceo-poseidon2 = { git = "https://github.com/Robert-MacWha/eddsa-babyjubjub" }
serde_with = "3.21.0"
ark-serialize = "0.6.0"
brotli = "8.0.4"
circuit-profiler = { path = "./circuit-profiler" }
alloy-node-bindings = "1.6.0"
alloy-signer-local = "1.6.0"
anyhow = "1.0.103"
insta = "1.48.0"
serde_json = "1.0"
criterion = "0.8.2"
tracing-subscriber = "0.3"
alloy-contract = "1.6.0"
ark-poly = "0.6.0"
k256 = "0.14"
ark-secp256k1 = "0.6.0"
signature = "3"
bindgen = "0.72"
