[package]
name = "tint-multisig-spendability"
version = "0.1.0"
edition = "2024"

[features]

[dependencies]
tint = { workspace = true }
ark-bn254 = { workspace = true, features = ["scalar_field"] }
ark-ff = { workspace = true }
num-bigint = "0.4.8"
thiserror = { workspace = true }

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
ark-ec = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true, features = ["std"] }
ark-secp256k1 = "0.6.0"
ark-std = { workspace = true }
taceo-poseidon2 = { workspace = true, features = ["t2", "t3", "t8"] }
alloy-primitives = { workspace = true }
