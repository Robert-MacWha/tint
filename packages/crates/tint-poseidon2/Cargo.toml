[package]
name = "tint-poseidon2"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-bn254 = { workspace = true }
ark-crypto-primitives = { workspace = true, features = ["crh", "constraints"] }
ark-ff = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-std = { workspace = true }
skew-mmr = { workspace = true }
taceo-poseidon2 = { workspace = true, features = ["t2", "t3", "t8"] }
tracing = { workspace = true }

[dev-dependencies]
alloy-contract = { workspace = true }
alloy-node-bindings = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-macro = { workspace = true, features = ["json"] }
alloy-sol-types = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[[bench]]
name = "groth16_poseidon_constraints"
harness = false
