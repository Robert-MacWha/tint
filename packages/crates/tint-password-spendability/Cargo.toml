[package]
name = "tint-password-spendability"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["alloy-contract"]

[features]
default = ["onchain"]
onchain = ["tint/onchain"]
codegen = ["taceo-groth16-sol"]
parallel = ["ark-groth16/parallel"]

[dependencies]
alloy-contract = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-sol-macro = { workspace = true, features = ["json"] }
alloy-sol-types = { workspace = true }
ark-bn254 = { workspace = true }
ark-groth16 = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
async-trait = { workspace = true }
rand_core = { workspace = true }
tint = { workspace = true }
tracing = { workspace = true }
taceo-groth16-sol = { version = "0.4.2", optional = true }
tint-groth16 = { workspace = true }

[dev-dependencies]
alloy-node-bindings = { workspace = true }
alloy-signer-local = { workspace = true }
anyhow = { workspace = true }
ark-ff = { workspace = true }
ark-relations = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[[bin]]
name = "gen_verifier"
required-features = ["codegen"]
