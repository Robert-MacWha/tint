[package]
name = "tint"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["ruint"]

[[bin]]
name = "gen_verifier"
required-features = ["codegen"]

[[bin]]
name = "gen_artifacts"

[features]
asm = ["ark-ff/asm"]
codegen = ["taceo-groth16-sol"]
parallel = ["ark-groth16/parallel"]
print-trace = ["ark-std/print-trace"]

[dependencies]
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-sol-macro = { workspace = true, features = ["json"] }
alloy-sol-types = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-hybrid-compression = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
async-trait = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
rand_core = { workspace = true, features = ["getrandom"] }
ruint = { workspace = true, features = ["ark-ff-06"] }
serde = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
skew-mmr = { workspace = true }
taceo-groth16-sol = { version = "0.4.2", optional = true }
thiserror = { workspace = true }
tint-groth16 = { workspace = true }
tint-poseidon2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
x25519-dalek = { workspace = true, features = ["static_secrets", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
alloy-contract = { workspace = true }
alloy-node-bindings = { workspace = true }
alloy-signer-local = { workspace = true }
anyhow = { workspace = true }
ark-profiler = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true

[[bench]]
name = "groth16_constraints"
harness = false

[[bench]]
name = "groth16_matrices"
harness = false
