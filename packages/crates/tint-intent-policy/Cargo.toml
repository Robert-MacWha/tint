[package]
name = "tint-intent-policy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gen_verifier"
required-features = ["codegen"]

[features]
codegen = ["taceo-groth16-sol"]
parallel = ["ark-groth16/parallel"]

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
taceo-groth16-sol = { version = "0.4.2", optional = true }
thiserror = { workspace = true }
tint = { workspace = true }
tint-groth16 = { workspace = true }
tint-poseidon2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
alloy-contract = { workspace = true }
alloy-node-bindings = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-macro = { workspace = true, features = ["json"] }
anyhow = { workspace = true }
ark-relations = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
