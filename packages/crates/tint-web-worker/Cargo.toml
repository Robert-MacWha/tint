[package]
name = "tint-web-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy = { workspace = true, features = ["dyn-abi", "json-abi", "json-rpc", "wasm-bindgen"] }
anyhow = { workspace = true }
ark-bn254 = { workspace = true }
ark-groth16 = { workspace = true }
ark-serialize = { workspace = true }
futures = { workspace = true }
js-sys = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
serde_json = { workspace = true }
tint = { workspace = true, features = ["parallel"] }
tint-groth16 = { workspace = true }
tint-web-protocol = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-rayon = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Response",
    "WorkerGlobalScope",
    "WorkerNavigator",
] }

[lints]
workspace = true
